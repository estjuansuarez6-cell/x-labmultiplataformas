<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fase 3 · Integración CAD — XR Lab UMNG</title>
<link rel="stylesheet" href="../css/xr-ui.css">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>

  <div class="xr-header">
    <div class="xr-header__bar">
      <div class="brand">
        <img src="../assets/umng-logo.png" alt="Escudo UMNG" class="brand__logo">
        <div class="brand__text">
          <h1>Fase 3 — Integración de modelo CAD</h1>
          <div class="school">index.html / fases / fase3.html</div>
        </div>
      </div>
      <a href="../index.html" class="xr-header__badge">← Panel principal</a>
    </div>
    <div class="xr-toolbar">
      <button class="chip is-active" data-view="modelo"><span class="chip__dot" style="background:#264653"></span>Ensamblaje 3D</button>
      <button class="chip" data-view="pipeline"><span class="chip__dot" style="background:#5b6472"></span>Cómo se generó</button>
      <button class="chip is-outline" data-view="reload">↻ Reintentar carga</button>
    </div>
  </div>

  <div class="xr-info" id="info">
    <span class="tag" id="tag">PARTE D · MODELO CAD</span>
    <strong id="title">Cargando models/Cubo_v1.glb…</strong>
    <span id="text">El ensamblaje se referencia desde la carpeta /models mediante a-asset-item.</span>
  </div>
  <div class="xr-hint">click + arrastrar: mirar · WASD: moverte</div>

  <a-scene vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">

    <a-assets timeout="15000">
      <a-asset-item id="modeloIndustrial" src="../models/Cubo_v1.glb"></a-asset-item>
    </a-assets>

    <a-plane rotation="-90 0 0" width="16" height="16" color="#e2e5ea"></a-plane>
    <a-sky color="#f4f5f7"></a-sky>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="2 4 3"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.3" position="-2 2 -3"></a-light>

    <!-- Modelo CAD real: Cubo_v1.glb — sin position fija: el script lo coloca
         una vez que conoce su tamaño real, para poder recentrarlo bien -->
    <a-entity id="cad-model"
              gltf-model="#modeloIndustrial"
              visible="false"></a-entity>

    <!-- Marcador de referencia (se activa si el GLB no está disponible) -->
    <a-entity id="cad-placeholder" position="0 0.3 -1.6" visible="false">
      <a-box position="0 0.35 0" width="0.9" height="0.7" depth="0.9" color="#5B6472"></a-box>
      <a-cylinder position="0 0.85 0" radius="0.22" height="0.35" color="#264653"></a-cylinder>
      <a-text value="ENSAMBLAJE PENDIENTE\ncoloca models/Cubo_v1.glb" align="center" position="0 1.35 0" width="2.6" color="#14181f"></a-text>
    </a-entity>

    <a-entity id="rig" position="0 1.4 0.8">
      <a-camera look-controls wasd-controls>
        <a-cursor color="#FAFAFA"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    const texts = {
      modelo: {
        loading:  { tag: "PARTE D · MODELO CAD", title: "Cargando models/Cubo_v1.glb…", text: "El ensamblaje se referencia desde la carpeta /models mediante a-asset-item." },
        loaded:   { tag: "PARTE D · MODELO CAD", title: "Ensamblaje cargado", text: "models/Cubo_v1.glb se cargó, se centró y se reescaló automáticamente para verse bien sin importar sus unidades originales. Queda fijo: usa el mouse/WASD para girar alrededor y analizarlo." },
        missing:  { tag: "PARTE D · SIN ARCHIVO", title: "Aún no existe models/Cubo_v1.glb", text: "Se muestra un marcador de referencia. Vuelve a colocar el archivo Cubo_v1.glb (exportado a GLB) en la carpeta models/." }
      },
      pipeline: { tag: "FLUJO DE TRABAJO", title: "SolidWorks → Blender → A-Frame", text: "1) Diseñar el ensamblaje en SolidWorks · 2) Exportar a STL · 3) Importar en Blender y reducir polígonos · 4) Exportar como Cubo_v1.glb (< 25 MB) · 5) Referenciarlo con a-asset-item en la escena." }
    };

    const model = document.querySelector('#cad-model');
    const placeholder = document.querySelector('#cad-placeholder');
    const info = document.querySelector('#info');
    const chips = document.querySelectorAll('.chip');
    let modelState = 'loading';

    function paint(data){
      info.innerHTML = `<span class="tag">${data.tag}</span><strong>${data.title}</strong>${data.text}`;
    }

    paint(texts.modelo.loading);

    model.addEventListener('model-loaded', (evt) => {
      modelState = 'loaded';

      // Los modelos CAD exportados desde SolidWorks pueden venir en cualquier
      // escala (metros, mm, piezas diminutas...). Aquí calculamos la caja
      // envolvente real de la malla MIENTRAS la entidad sigue en el origen
      // (sin posición ni escala propias), para que el cálculo esté en el
      // mismo espacio local que usaremos para recentrar y escalar. Recién al
      // final movemos la entidad ya escalada hasta su posición final frente
      // a la cámara — así la traslación no se ve afectada por el escalado.
      const mesh = evt.detail.model;
      const box = new THREE.Box3().setFromObject(mesh);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 0.01;
      const targetSize = 1.5; // tamaño objetivo en metros dentro de la escena
      const fitScale = targetSize / maxDim;

      mesh.position.sub(center);                 // recentra la malla en el origen local
      model.object3D.scale.setScalar(fitScale);  // escala ya con el pivote correcto
      model.setAttribute('position', '0 1.1 -1.4'); // ubicación final, justo frente al spawn

      model.setAttribute('visible', true);
      placeholder.setAttribute('visible', false);

      document.querySelector('.chip[data-view="modelo"]').classList.contains('is-active') && paint(texts.modelo.loaded);
    });

    model.addEventListener('model-error', () => {
      modelState = 'missing';
      placeholder.setAttribute('visible', true);
      model.setAttribute('visible', false);
      document.querySelector('.chip[data-view="modelo"]').classList.contains('is-active') && paint(texts.modelo.missing);
    });

    chips.forEach(chip => chip.addEventListener('click', () => {
      const view = chip.dataset.view;

      if (view === 'reload'){
        location.reload();
        return;
      }

      chips.forEach(c => { if (c.dataset.view !== 'reload') c.classList.toggle('is-active', c === chip); });

      if (view === 'pipeline'){
        paint(texts.pipeline);
      } else {
        paint(modelState === 'loaded' ? texts.modelo.loaded : modelState === 'missing' ? texts.modelo.missing : texts.modelo.loading);
      }
    }));
  </script>

</body>
</html>
