<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fase 1 · Escena básica — XR Lab UMNG</title>
<link rel="stylesheet" href="../css/xr-ui.css">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>

  <div class="xr-header">
    <div class="xr-header__bar">
      <div class="brand">
        <img src="../assets/umng-logo.png" alt="Escudo UMNG" class="brand__logo">
        <div class="brand__text">
          <h1>Fase 1 — Escena básica</h1>
          <div class="school">index.html / fases / fase1.html</div>
        </div>
      </div>
      <a href="../index.html" class="xr-header__badge">← Panel principal</a>
    </div>
    <div class="xr-toolbar">
      <button class="chip is-active" data-spot="general"><span class="chip__dot" style="background:#5b6472"></span>Vista general</button>
      <button class="chip" data-spot="cilindro"><span class="chip__dot" style="background:#E76F51"></span>a-cylinder</button>
      <button class="chip" data-spot="caja"><span class="chip__dot" style="background:#2A9D8F"></span>a-box</button>
      <button class="chip" data-spot="esfera"><span class="chip__dot" style="background:#6A4C93"></span>a-sphere</button>
    </div>
  </div>

  <div class="xr-info" id="info">
    <span class="tag">PARTE A · CONFIGURACIÓN INICIAL</span>
    <strong>Estructura básica de A-Frame</strong>
    Tres primitivas sobre un plano de estudio: el cilindro abre la escena, seguido de la caja y la esfera.
  </div>
  <div class="xr-hint">click + arrastrar: mirar · WASD: moverte</div>

  <a-scene vr-mode-ui="enabled: true" xr-mode-ui="enabled: true" fog="type: linear; color: #F4E7DA; near: 7; far: 20">

    <a-plane rotation="-90 0 0" width="12" height="12" color="#EDE0D3"></a-plane>
    <a-sky color="#F4E7DA"></a-sky>

    <a-light type="ambient" color="#fff3e6" intensity="0.55"></a-light>
    <a-light type="directional" color="#ffd9a8" intensity="0.6" position="-2 4 2"></a-light>

    <!-- Orden: 1) cilindro, 2) caja, 3) esfera -->
    <a-cylinder id="obj-cilindro" position="-2 1 -3" radius="0.5" height="1.5" color="#E76F51"></a-cylinder>
    <a-box id="obj-caja" position="0 1 -3.5" rotation="0 30 0" color="#2A9D8F"></a-box>
    <a-sphere id="obj-esfera" position="2 1 -3" radius="1" color="#6A4C93"></a-sphere>

    <a-entity id="rig" position="0 1.6 2">
      <a-camera look-controls wasd-controls>
        <a-cursor color="#FAFAFA"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    const info = {
      general:  { tag: "PARTE A · CONFIGURACIÓN INICIAL", title: "Estructura básica de A-Frame", text: "Tres primitivas sobre un plano de estudio: el cilindro abre la escena, seguido de la caja y la esfera." },
      cilindro: { tag: "a-cylinder", title: "Primitiva: cilindro", text: "Combina radius y height. Color #E76F51, es la primera entidad declarada dentro de a-scene." },
      caja:     { tag: "a-box", title: "Primitiva: caja", text: "Definida con position y rotation (0 30 0). Color #2A9D8F, ubicada al centro de la escena." },
      esfera:   { tag: "a-sphere", title: "Primitiva: esfera", text: "Usa el atributo radius en lugar de width/height/depth. Color #6A4C93." }
    };

    const spots = {
      general:  { x: 0,    y: 1.6, z: 2   },
      cilindro: { x: -1.4, y: 1.3, z: -1  },
      caja:     { x: 0,    y: 1.3, z: -1.6 },
      esfera:   { x: 1.6,  y: 1.3, z: -1  }
    };

    const rig = document.querySelector('#rig');
    const infoBox = document.querySelector('#info');
    const chips = document.querySelectorAll('.chip');

    function goTo(spotKey){
      const s = spots[spotKey];
      rig.setAttribute('animation', { property: 'position', to: `${s.x} ${s.y} ${s.z}`, dur: 650, easing: 'easeInOutQuad' });

      chips.forEach(c => c.classList.toggle('is-active', c.dataset.spot === spotKey));

      const d = info[spotKey];
      infoBox.innerHTML = `<span class="tag">${d.tag}</span><strong>${d.title}</strong>${d.text}`;
    }

    chips.forEach(c => c.addEventListener('click', () => goTo(c.dataset.spot)));
  </script>

</body>
</html>
